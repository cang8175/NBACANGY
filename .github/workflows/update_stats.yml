name: Update Daily NBA Standings

# 允許在 Actions 頁面手動點擊按鈕執行 (方便測試)
on:
  schedule:
    # 每天 UTC 時間 06:00 執行 (大約是台灣時間下午 2 點，通常比賽結束後)
    - cron: '0 6 * * *'
  workflow_dispatch: 

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4 
        
      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 3. Install dependencies
        # 由於 requirements.txt 在專案根目錄，不需要指定路徑
        run: pip install -r requirements.txt 
        
      - name: 4. Run NBA Data Fetch Script
        env:
          # 將 GitHub Secrets 注入環境變數，Python 腳本就能讀取
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/fetch_standings.py